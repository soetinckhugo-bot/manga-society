name: CI

# Pipeline de vérification MANGA SOCIETY — rouge = pas de merge.
# Ordre : lint → typecheck → migrations Supabase (db reset) → build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ne sert qu'au `next build` (présence des variables requises côté Next).
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
  SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-ci
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint ESLint (npm ci = build reproductible depuis package-lock.json)
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # --------------------------------------------------------------------------
  # 2. Typecheck TypeScript strict (zéro `any`)
  # --------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # --------------------------------------------------------------------------
  # 3. Base Supabase locale : les migrations s'appliquent proprement dans l'ordre.
  #
  # Le schéma vit désormais en migrations ordonnées, auto-déployables par
  # l'intégration GitHub de Supabase :
  #   0000_schema.sql     (tables, index, RLS, grants)
  #   0001_functions.sql  (RPC + trigger + GRANT EXECUTE)
  #   0002_seed.sql       (thèmes, cosmétiques, pool de quêtes)
  # `supabase db reset` applique ce dossier dans l'ordre strict sur la stack
  # locale (Postgres 15). Le CLI démarre la stack ; la connexion locale par
  # défaut est postgres:postgres@127.0.0.1:54322.
  # --------------------------------------------------------------------------
  supabase:
    name: Schéma Supabase
    needs: typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer la stack Supabase locale (Postgres 15)
        run: supabase start
      - name: Appliquer les migrations (0000 → 0001 → 0002)
        run: supabase db reset
      - name: Vérifications de cohérence minimales
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "select count(*) as themes from public.themes;"
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "select proname from pg_proc where proname = 'open_booster';"

  # --------------------------------------------------------------------------
  # 4. Build de production Next.js
  # --------------------------------------------------------------------------
  build:
    name: Build
    needs: supabase
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
