name: CI

# Pipeline de vérification MANGA SOCIETY — rouge = pas de merge.
# Ordre : lint → typecheck → migrations Supabase (db reset) + npm run test → build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ne sert qu'au `next build` (présence des variables requises côté Next).
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
  SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-ci
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint ESLint (npm ci = build reproductible depuis package-lock.json)
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # --------------------------------------------------------------------------
  # 2. Typecheck TypeScript strict (zéro `any`)
  #
  # Next 16 injecte les helpers globaux de routes (LayoutProps, PageProps,
  # RouteContext) via `next typegen` — ils vivent dans .next/types, absent d'un
  # checkout frais. Génération OBLIGATOIRE avant tsc, sinon erreur
  # "Cannot find name 'LayoutProps'" (cf. docs Next 16, upgrading guide).
  # --------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Générer les types de routes (next typegen)
        run: npx next typegen
      - run: npx tsc --noEmit

  # --------------------------------------------------------------------------
  # 3. Base Supabase locale : les migrations s'appliquent proprement dans l'ordre.
  #
  # Le schéma vit désormais en migrations ordonnées, auto-déployables par
  # l'intégration GitHub de Supabase :
  #   0000_schema.sql     (tables, index, RLS, grants)
  #   0001_functions.sql  (RPC + trigger + GRANT EXECUTE)
  #   0002_seed.sql       (thèmes, cosmétiques, pool de quêtes)
  # `supabase db reset` applique ce dossier dans l'ordre strict sur la stack
  # locale (Postgres 15). Le CLI démarre la stack ; la connexion locale par
  # défaut est postgres:postgres@127.0.0.1:54322.
  # --------------------------------------------------------------------------
  supabase:
    name: Schéma Supabase
    needs: typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer la stack Supabase locale (Postgres 15)
        run: supabase start
      - name: Appliquer les migrations (0000 → 0008)
        run: supabase db reset
      - name: Clés service role + anon du Supabase local
        # Les tests s'authentifient contre le Supabase LOCAL du runner
        # (SPEC §8 : jamais le cloud). Les clés du bloc env sont des
        # placeholders. NE PAS utiliser `supabase status -o env` pour les
        # extraire : la sortie peut être vide (services partiels) et écraser
        # les vars avec du VIDE → tests DB skippés silencieusement et CI
        # verte trompeuse (trouvé en hotfix, cf. QA_REPORT E-11). La stack
        # locale n'ayant PAS de jwt_secret custom (supabase/config.toml),
        # ses clés sont les JWT démo standards — valeurs publiques non
        # secrètes. Si un jwt_secret custom est ajouté un jour, échoue fort
        # ici plutôt que de skipper :
        run: |
          {
            echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: |
          # pipefail : sans lui, `vitest not found` (exit 127) est avalé par
          # le pipe vers tee et le step passe au vert (trouvé en hotfix, cf.
          # QA_REPORT E-11) — la CI était verte SANS exécuter un seul test.
          set -o pipefail
          npm run test 2>&1 | tee /tmp/vitest.log
          # Garde de non-exécution : vitest doit avoir produit un récap.
          grep -E '^ *Test Files' /tmp/vitest.log || { echo "::error::vitest n'a produit aucun récap — tests non exécutés"; exit 1; }
          # Anti skip silencieux (E-11) : un test DB skippé = CI verte
          # trompeuse. Tout fichier DB/sketch en "skipped" fait échouer le job.
          if grep -E '(tests/concurrency|tests/economy\.business|tests/rls-audit|scripts/smoke-engine)\S* .*[0-9]+ skipped' /tmp/vitest.log; then
            echo "::error::Tests DB skippés — clés/env manquants, cf. étape précédente"
            exit 1
          fi
      - name: Vérifications de cohérence minimales
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "select count(*) as themes from public.themes;"
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "select proname from pg_proc where proname = 'open_booster';"

  # --------------------------------------------------------------------------
  # 4. Build de production Next.js
  # --------------------------------------------------------------------------
  build:
    name: Build
    needs: supabase
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
